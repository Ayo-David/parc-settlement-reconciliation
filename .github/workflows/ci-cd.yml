name: CI/CD Pipeline

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CONTAINER_NAME: parc-settlement-reconciliation

jobs:
  # 1. TEST JOB
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # ADR-023, D178: the shared database is bootstrapped with TS-DB-000, then
      # migrated as the NOBYPASSRLS schema owner, exactly as deployed. Tests
      # run the service code as the app login so forced RLS applies.
      DATABASE_URL: postgresql://parc_settlement_migrator:ci-migrator@localhost:5432/parc_treasury_settlement_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/parc_treasury_settlement_test
      TEST_APP_DATABASE_URL: postgresql://parc_settlement_app:ci-app@localhost:5432/parc_treasury_settlement_test
    steps:
      - uses: actions/checkout@v4
      # SEC-02: fail before anything is built if the working tree holds a
      # secret (gitleaks default rules + .gitleaks.toml allowlist).
      - name: Secret scan
        run: >-
          docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.21.2
          dir /repo --config /repo/.gitleaks.toml --redact --no-banner
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - name: Bootstrap the shared database (TS-DB-000)
        run: >-
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1
          -v database=parc_treasury_settlement_test
          -v settlement_migrator_password=ci-migrator -v settlement_app_password=ci-app
          -v treasury_migrator_password=ci-treasury -v treasury_app_password=ci-treasury
          -f db/bootstrap/treasury-settlement.sql
      - run: yarn migrate:latest
      - run: yarn validate

  # 2. BUILD & PUSH JOB (Strictly using short-sha & build provenance)
  build-and-push:
    needs: validate
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Crucial: gives GITHUB_TOKEN permission to publish packages

    outputs:
      short_sha: ${{ steps.meta.outputs.version }} # Passes the short SHA to the deploy job

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # No external secrets needed here

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Primary immutable deployment unit (outputs format: sha-xxxxxxx)
            type=sha,prefix=sha-,format=short,priority=300
            # Floating convenience tag for development visibility
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }},priority=100

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true # Enforces build provenance generation (SLSA framework)
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3. DEPLOY JOB (Runs via SSH after build completes successfully)
  # Runtime secrets come from /opt/parc/parc-settlement-reconciliation/.env on the server, not GitHub secrets.
  deploy:
    needs: build-and-push
    if: always() && needs.build-and-push.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production # requires manual approval if the "production" environment has protection rules configured
    concurrency:
      group: deploy-parc-settlement-reconciliation
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          SHORT_SHA: ${{ needs.build-and-push.outputs.short_sha }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: REGISTRY,IMAGE_NAME,CONTAINER_NAME,SHORT_SHA,GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -euo pipefail

            # Non-secret service identity; these override the same keys if they also appear in the env file.
            export NODE_ENV=production HOST=0.0.0.0 SERVICE_NAME=parc-settlement-reconciliation PORT=3011
            # Image references must be lowercase; metadata-action lowercased the pushed name.
            IMAGE_NAME=$(printf '%s' "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
            # Per-service server state: .env plus current/previous image tags for rollback.
            STATE_ROOT=/opt/parc
            STATE_DIR="$STATE_ROOT/${CONTAINER_NAME}"
            # Secrets and environment-specific settings live only on the server, never in GitHub.
            ENV_FILE="$STATE_DIR/.env"
            if ! mkdir -p "$STATE_DIR" 2>/dev/null; then
              echo "Cannot create $STATE_DIR. Prepare the server once: sudo mkdir -p $STATE_ROOT && sudo chown $(id -un):$(id -gn) $STATE_ROOT" >&2
              exit 1
            fi
            chmod 700 "$STATE_DIR"

            if [ ! -f "$ENV_FILE" ]; then
              LEGACY_DIR="$HOME/parc/${CONTAINER_NAME}"
              if [ -f "$LEGACY_DIR/.env" ]; then
                echo "Missing $ENV_FILE, but $LEGACY_DIR/.env exists from the previous layout. Copy it once: cp -a $LEGACY_DIR/. $STATE_DIR/" >&2
              else
                echo "Missing $ENV_FILE on the server; create it from the repository's .env.example first." >&2
              fi
              exit 1
            fi
            chmod 600 "$ENV_FILE"

            # Last assignment wins, matching docker --env-file.
            env_value() { sed -n "s/^$1=//p" "$ENV_FILE" | tail -n 1; }

            # CB-7 slice A: the service and its two workers. The database comes from the
            # TS-DB-000 bootstrap (parc-platform/scripts/bootstrap-treasury-settlement.sql).
            for key in DATABASE_URL MIGRATION_DATABASE_URL RABBITMQ_URL STATEMENT_STORE_ENDPOINT STATEMENT_STORE_ACCESS_KEY_ID STATEMENT_STORE_SECRET_ACCESS_KEY STATEMENT_ENCRYPTION_KEY_ID STATEMENT_ENCRYPTION_KEY_BASE64; do
              if [ -z "$(env_value "$key")" ]; then
                echo "$ENV_FILE must set $key." >&2
                exit 1
              fi
            done

            stop_service() {
              for container in "$CONTAINER_NAME" "$CONTAINER_NAME-outbox-worker" "$CONTAINER_NAME-event-worker"; do
                docker stop "$container" >/dev/null 2>&1 || true
                docker rm "$container" >/dev/null 2>&1 || true
              done
            }

            start_service() {
              # The image tag (sha-xxxxxxx) is the running version, including after a rollback.
              export SERVICE_VERSION="${1##*:}"
              WORKER_CONTAINERS=()
              docker run -d \
                --name "$CONTAINER_NAME" \
                --restart always \
                --network host \
                --env-file "$ENV_FILE" \
                -e NODE_ENV -e HOST -e PORT -e SERVICE_NAME -e SERVICE_VERSION \
                "$1"
              # CB1-12: relays outbox_events to RabbitMQ (RABBITMQ_URL). Exactly one publisher runs.
              docker run -d --name "$CONTAINER_NAME-outbox-worker" --restart always --network host --env-file "$ENV_FILE" -e NODE_ENV -e HOST -e PORT -e SERVICE_NAME -e SERVICE_VERSION "$1" node dist/src/workers/outbox-publisher-worker.js
              WORKER_CONTAINERS+=("$CONTAINER_NAME-outbox-worker")
              # CB-7 slice A (D179): projects Payment completions and Ledger journals.
              docker run -d --name "$CONTAINER_NAME-event-worker" --restart always --network host --env-file "$ENV_FILE" -e NODE_ENV -e HOST -e PORT -e SERVICE_NAME -e SERVICE_VERSION "$1" node dist/src/workers/event-worker.js
              WORKER_CONTAINERS+=("$CONTAINER_NAME-event-worker")
            }

            service_ready() {
              curl --fail --silent --max-time 2 "http://127.0.0.1:${PORT}/health" >/dev/null || return 1
              # Workers have no HTTP endpoint; require them to be running without restarts.
              for worker in "${WORKER_CONTAINERS[@]}"; do
                [ "$(docker inspect -f '{{.State.Running}}/{{.RestartCount}}' "$worker" 2>/dev/null)" = "true/0" ] || return 1
              done
            }

            wait_until_ready() {
              # Give crash-looping containers time to show up as restarts before the first probe.
              sleep 5
              for _ in $(seq 1 20); do
                service_ready && return 0
                sleep 3
              done
              return 1
            }

            IMAGE_URI="${REGISTRY}/${IMAGE_NAME}:${SHORT_SHA}"

            # Authenticate for each deploy because the repository's GHCR image is private.
            # Keep the short-lived workflow token out of the server's persistent Docker config.
            DOCKER_CONFIG=$(mktemp -d)
            trap 'rm -rf "$DOCKER_CONFIG"' EXIT
            printf '%s' "$GHCR_TOKEN" | docker --config "$DOCKER_CONFIG" login "$REGISTRY" \
              --username "$GHCR_USERNAME" --password-stdin
            echo "Pulling immutable deployment unit: $IMAGE_URI"
            docker --config "$DOCKER_CONFIG" pull "$IMAGE_URI"

            # --- STEP 1: RUN DATABASE MIGRATIONS (forward-only; never reverted on rollback) ---
            # MIGRATION_DATABASE_URL lets migrations use a DDL-owning login while the
            # application keeps its least-privilege DATABASE_URL; it falls back to DATABASE_URL.
            MIGRATION_DATABASE_URL=$(env_value MIGRATION_DATABASE_URL)
            [ -n "$MIGRATION_DATABASE_URL" ] || MIGRATION_DATABASE_URL=$(env_value DATABASE_URL)
            echo "Running production database migrations..."
            DATABASE_URL="$MIGRATION_DATABASE_URL" docker run --rm \
              --name "${CONTAINER_NAME}-migration" \
              --network host \
              -e NODE_ENV \
              -e DATABASE_URL \
              "$IMAGE_URI" \
              yarn migrate:runtime

            # --- STEP 2: SWAP APPLICATION CONTAINERS ---
            echo "Replacing application containers..."
            stop_service
            start_service "$IMAGE_URI"

            # --- STEP 3: HEALTH-CHECK THE NEW CONTAINERS, AUTO-ROLLBACK ON FAILURE ---
            echo "Waiting for the new containers to report ready..."
            if wait_until_ready; then
              # Only a healthy deploy promotes the last known-good image to the rollback target.
              if [ -f "$STATE_DIR/current_image.txt" ]; then
                cp "$STATE_DIR/current_image.txt" "$STATE_DIR/previous_image.txt"
              fi
              echo "$IMAGE_URI" > "$STATE_DIR/current_image.txt"
              echo "Deploy succeeded: $IMAGE_URI"
              docker image prune -af --filter "until=72h"
            else
              echo "New containers failed readiness checks; rolling back." >&2
              docker logs --tail 50 "$CONTAINER_NAME" >&2 || true
              stop_service
              # current_image.txt is untouched on failure, so it still names the last known-good image.
              if [ -f "$STATE_DIR/current_image.txt" ]; then
                start_service "$(cat "$STATE_DIR/current_image.txt")"
              fi
              exit 1
            fi
